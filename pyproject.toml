[project]
name = "proweb-crypto-signal-engine"
version = "0.1.0"
description = "Event-aware deterministic crypto signal engine with Telegram delivery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "python-telegram-bot>=21.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
